<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="R5 Mastery">
<meta name="description" content="A checklist for learning every feature of the Canon EOS R5.">
<title>R5 Mastery</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141618; --panel:#1D2023; --panelHi:#24282C; --line:#2E3338;
    --text:#E9E7E2; --muted:#878E95; --accent:#D45FA6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    padding-bottom:calc(48px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .dsp{font-family:'Barlow Condensed','Oswald',Impact,sans-serif;letter-spacing:.04em;}
  .mono{font-family:'Roboto Mono',ui-monospace,monospace;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible{outline:2px solid var(--text);outline-offset:2px;}

  header{
    padding:calc(22px + env(safe-area-inset-top)) 18px 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#191C1F 0%,#141618 100%);
    position:sticky;top:0;z-index:10;
  }
  .eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.22em;}
  h1{font-size:30px;font-weight:700;line-height:1.05;margin:2px 0 0;}
  #meter{display:flex;gap:2px;align-items:flex-end;height:26px;margin-top:16px;}
  #meter i{flex:1;border-radius:1px;background:var(--line);opacity:.55;transition:background .25s ease,opacity .25s ease;}
  #meter i.major{height:100%;}
  #meter i.minor{height:62%;}
  #meter i.lit{background:var(--accent);opacity:1;}
  .meterLabels{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted);}
  .meterLabels b{color:var(--accent);font-weight:500;}

  nav{display:flex;overflow-x:auto;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto;background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:4px;padding:7px 12px;font-size:14px;font-weight:600;
    text-transform:uppercase;letter-spacing:.1em;
  }
  nav button.complete{color:var(--accent);}
  nav button.active{background:var(--accent);color:#141618;border-color:var(--accent);}
  nav button span{font-size:10px;margin-left:6px;opacity:.75;}

  .sectionHead{padding:20px 18px 6px;}
  .sectionHead h2{margin:0;font-size:26px;font-weight:700;text-transform:uppercase;color:var(--accent);}
  .sectionHead p{margin:8px 0 0;font-size:14px;line-height:1.55;color:var(--muted);}

  .filters{display:flex;gap:8px;padding:14px 18px 6px;align-items:center;}
  .filters button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:20px;padding:6px 14px;font-size:13px;}
  .filters button.on{background:var(--panelHi);color:var(--text);border-color:var(--line);}
  .filters .count{margin-left:auto;font-size:11px;color:var(--muted);}

  #list{padding:8px 14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;margin-bottom:10px;overflow:hidden;}
  .card.open{border-color:var(--accent);}
  .card.done{border-left-color:var(--accent);}
  .row{display:flex;align-items:flex-start;}
  .tickBtn{background:none;border:none;padding:16px 10px 16px 14px;}
  .tick{
    display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
    border:2px solid #4A5158;color:#141618;font-size:13px;font-weight:700;
  }
  .done .tick{border-color:var(--accent);background:var(--accent);}
  .titleBtn{flex:1;text-align:left;background:none;border:none;color:var(--text);padding:16px 14px 16px 0;}
  .done .titleBtn{color:var(--muted);}
  .titleBtn .t{font-size:15.5px;font-weight:500;line-height:1.35;display:block;}
  .done .titleBtn .t{text-decoration:line-through;}
  .titleBtn .sub{font-size:11px;color:var(--muted);margin-top:6px;display:block;}

  .detail{padding:0 16px 18px 47px;}
  .whereBox{background:var(--panelHi);border-radius:5px;padding:11px 12px;margin-bottom:14px;}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.16em;margin-bottom:5px;}
  .lbl.accent{color:var(--accent);}
  .lbl.muted{color:var(--muted);margin-bottom:10px;}
  .whereBox div:last-child{font-size:13.5px;line-height:1.55;}
  .opt{padding-bottom:11px;margin-bottom:11px;border-bottom:1px solid var(--line);}
  .opt:last-of-type{border-bottom:none;}
  .opt .n{font-size:14px;font-weight:600;margin-bottom:3px;}
  .opt .u{font-size:13.5px;line-height:1.55;color:var(--muted);}
  .tip{margin-top:6px;padding-left:12px;border-left:2px solid var(--accent);font-size:13.5px;line-height:1.55;color:#C6C9CC;font-style:italic;}
  .markBtn{
    margin-top:18px;width:100%;background:var(--accent);color:#141618;border:1px solid var(--accent);
    border-radius:5px;padding:11px;font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  }
  .done .markBtn{background:transparent;color:var(--muted);border-color:var(--line);}

  .empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6;}
  footer{padding:18px;font-size:12px;line-height:1.6;color:#5F666C;border-top:1px solid var(--line);margin-top:20px;}
  footer button{background:none;border:none;color:#5F666C;text-decoration:underline;padding:0;font-size:12px;margin-top:10px;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<header>
  <div class="dsp eyebrow">Canon EOS R5</div>
  <h1 class="dsp">MASTERY METER</h1>
  <div id="meter"></div>
  <div class="meterLabels mono"><span id="meterCount"></span><b id="meterPct"></b></div>
</header>

<nav id="tabs"></nav>

<div class="sectionHead">
  <h2 class="dsp" id="secName"></h2>
  <p id="secBlurb"></p>
</div>

<div class="filters">
  <button data-f="all" class="on">All</button>
  <button data-f="todo">To learn</button>
  <button data-f="done">Learned</button>
  <span class="count mono" id="secCount"></span>
</div>

<div id="list"></div>

<footer>
  Built for the original EOS R5. Menu wording shifts slightly between firmware versions, and the R5 Mark II
  uses different AF area names. Check anything critical against your own body before a paid shoot.
  <br><button id="reset">Reset all progress</button>
</footer>

<script>
const SECTIONS = [
  {
    id: "af",
    tab: "AF",
    name: "Autofocus",
    color: "#D45FA6",
    blurb:
      "The single biggest jump from the 7D. The R5 focuses with the whole sensor, so the old 'pick a point, recompose' habits are optional now.",

      {
        id: "af-method",
        title: "AF method (the focus area)",
        where:
          "Press the AF point selection button (top right, thumb side), then press M-Fn to cycle. Or AF menu → AF method.",
        options: [
          ["Face+Tracking (whole area)", "Default for people, pets, events. Camera finds the subject anywhere in the frame and sticks to it."],
          ["Spot AF", "Smallest box. Eyelashes through a fence, a single flower stamen, tight macro."],
          ["1-point AF", "Your 7D habit. Precise, predictable, no surprises. Landscapes, architecture, studio."],
          ["Expand AF area (4 points)", "1-point with helpers above/below/left/right. Slow, predictable movement."],
          ["Expand AF area: Around (8 points)", "Same idea, more forgiving. Erratic movement, handheld at long focal lengths."],
          ["Zone AF", "A block you place. Camera auto-selects inside it. Keeps focus off clutter outside the block."],
          ["Large Zone: Vertical", "Tall band. Someone walking toward you, a jumper, a portrait subject moving in depth."],
          ["Large Zone: Horizontal", "Wide band. Runners crossing, birds in level flight, sideline sports."],
        ],
        tip: "Practice drill: shoot the same moving subject with Face+Tracking, then Large Zone, then 1-point. Compare keeper rates.",
      },
      {
        id: "af-operation",
        title: "AF operation — One-Shot vs Servo",
        where: "AF menu → AF operation, or M-Fn button.",
        options: [
          ["One-Shot AF", "Focus locks and stays. Still subjects, focus-and-recompose, anything you want confirmed before firing."],
          ["Servo AF", "Focus keeps updating while you hold. Anything that moves, including a subject who breathes and sways during a portrait."],
        ],
        tip: "No AI Focus mode here for stills — you choose. Most pros live in Servo and control it with the thumb button.",
      },
      {
        id: "af-subject",
        title: "Subject to detect + eye detection",
        where: "AF menu → Subject to detect / Eye detection.",
        options: [
          ["People", "Faces, then eyes, then head, then body as the subject gets smaller or turns away."],
          ["Animals", "Dogs, cats, birds. Finds the eye on birds in flight surprisingly well."],
          ["Vehicles", "Cars and motorcycles; has a spot-detection option that targets the driver's helmet."],
          ["None", "Turn detection off when you want the camera to stop jumping to a bystander's face."],
          ["Eye detection On/Off", "Off is useful in a crowd or when a face keeps stealing focus from your real subject."],
        ],
        tip: "Detection is per-mode, not global. Set it, then save it into a Custom mode (C1–C3) so it's one click away.",
      },
      {
        id: "af-cases",
        title: "Servo AF cases 1–4 and Auto",
        where: "AF menu → Servo AF characteristics (Case Auto, 1, 2, 3, 4).",
        options: [
          ["Case Auto", "Camera adapts. Fine starting point while you learn the others."],
          ["Case 1 — versatile", "General purpose. Good default for events and portraits."],
          ["Case 2 — ignore obstacles", "Subject stays in focus when something crosses in front. Sideline sports, fences, crowds."],
          ["Case 3 — snap to nearest", "Grabs whatever enters the frame closest. Cyclists rounding a bend, start of a race."],
          ["Case 4 — for accel/decel", "Subjects that change speed sharply. Soccer, tennis, kids."],
        ],
        tip: "Each case is really three sliders: tracking sensitivity, accel/decel tracking, AF point auto switching. Open one and read the sliders — then you'll understand all of them.",
      },
      {
        id: "af-bbf",
        title: "Back-button AF (decoupling focus from the shutter)",
        where:
          "Custom Functions → Customize buttons. Set AF-ON to 'Metering and AF start', set shutter half-press to 'Metering start' only.",
        options: [
          ["Thumb focuses, finger shoots", "Hold AF-ON for Servo tracking; release it and you have One-Shot behavior, no menu diving."],
          ["Second button as a modifier", "Assign the * button to 'Switch to registered AF function' for an instant alternate setup."],
        ],
        tip: "This is the single habit that most separates the pros. Give yourself two weeks of awkwardness.",
      },
      {
        id: "af-touchdrag",
        title: "Touch & drag AF",
        where: "AF menu → Touch & drag AF settings.",
        options: [
          ["Positioning: Absolute", "Where you touch is where the point goes. Fast, less precise."],
          ["Positioning: Relative", "Swipe to nudge the point from where it is. Better with your eye to the finder."],
          ["Active touch area", "Limit it to the right half or a corner so your nose doesn't move the point."],
        ],
        tip: "Nose-drag is the #1 complaint from DSLR converts. Fixing this takes 30 seconds.",
      },
      {
        id: "af-initial",
        title: "Initial Servo AF point for Face+Tracking",
        where: "AF menu → Initial Servo AF pt for Face+Tracking.",
        options: [
          ["Auto", "Camera decides where to start looking."],
          ["Initial AF point set for Servo AF", "You tell it where to start, then it tracks from there. Best for busy scenes."],
          ["AF point set for the AF method", "Starts from your last manual point."],
        ],
        tip: "Set this and Face+Tracking stops feeling random.",
      },
      {
        id: "af-mf",
        title: "Manual focus aids",

          ["Magnify 5×/10×", "Tripod work, astro, product. Confirm critical focus before firing."],
          ["Focus ring direction / full-time MF", "Set in Custom Functions so RF lenses turn the way your EF lenses did."],
        ],

      },
      {
        id: "af-register",

      {
        id: "af-orientation",

        tip: "If you rotate the camera constantly and keep having to move the point back, this is the fix.",
      },
      {
        id: "af-limit",
        title: "Limit AF methods",
        where: "AF menu → Limit AF methods (uncheck what you never use).",
        options: [
          ["Keep three or four", "M-Fn cycles through fewer options, so you land on the one you want in one press instead of five."],
        ],
        tip: "Do this after a month, once you know which areas you actually reach for.",
      },
      {
        id: "af-priority",
        title: "Focus vs release priority",
        where: "AF menu → One-Shot AF release priority / Servo 1st image priority / Servo 2nd image priority.",
        options: [
          ["Focus priority", "Camera won't fire until it confirms focus. Portraits, product, anything you can't reshoot out of focus."],
          ["Release priority", "Fires whenever you press. Sports — a slightly soft frame beats a missed moment."],
          ["Equal priority (Servo)", "Balanced. Reasonable default for events."],
        ],
        tip: "Servo 1st and 2nd image are separate settings. First frame focus-priority, later frames speed-priority is a common burst setup.",
      },
      {
        id: "af-assist",
        title: "AF-assist beam",
        where: "AF menu → AF-assist beam firing (requires a Speedlite or compatible accessory).",
        options: [
          ["Enable", "Dark receptions and venues where the camera hunts."],
          ["Disable", "Ceremonies, theater, wildlife — anywhere a beam on your subject is rude or spooks them."],
          ["IR AF-assist beam only", "Uses the infrared pattern rather than a burst of visible light."],
        ],
      },
    ],
  },
  {
    id: "exp",
    tab: "EXP",
    name: "Exposure & metering",
    color: "#E0574F",
    blurb:
      "Mostly familiar from the 7D — except the finder now shows you the actual exposure before you shoot.",
    items: [
      {
        id: "exp-modes",
        title: "Shooting modes, including Fv",
        where: "Press the MODE button (there's no mode dial).",
        options: [
          ["P / Tv / Av / M / B", "Same as the 7D. Bulb is its own mode now instead of past 30s in M."],
          ["Fv (Flexible priority)", "RF-only. Every parameter is either Auto or set by you, changed on the fly. Av that becomes M mid-shot without switching modes."],
          ["C1 / C2 / C3", "Saved setups. Cover these under Controls & customization."],
        ],
        tip: "Fv is worth a full afternoon. It's the mode most 7D shooters never try and most R5 owners end up living in.",
      },
      {
        id: "exp-metering",
        title: "Metering modes",
        where: "M-Fn button, or shooting menu → Metering mode.",
        options: [
          ["Evaluative", "Whole scene, weighted to the AF point. Default."],
          ["Partial (~5.8%)", "Backlit subject that fills a chunk of the frame."],
          ["Spot (~2.9%)", "Stage lighting, high-contrast portraits, moon."],
          ["Center-weighted average", "Predictable and consistent — good when you meter once and shoot a whole series."],
        ],
        tip: "With exposure simulation on, metering matters less than it did on the 7D. Trust your eyes and the histogram.",
      },
      {
        id: "exp-iso",
        title: "ISO and Auto ISO limits",
        where: "ISO button; shooting menu → ISO speed settings.",
        options: [
          ["Auto ISO range", "Set a ceiling you're happy printing. Many R5 shooters cap around 6400–12800."],
          ["Minimum shutter speed", "Auto (biased slower/faster) or a hard floor. Stops Auto ISO from handing you 1/30s at 200mm."],
          ["Auto ISO in Manual + exposure comp", "Lock aperture and shutter, let ISO float, still dial in brightness. The pro workhorse setting."],
        ],
        tip: "The R5 has a dual-gain sensor. Test your own tolerance from ISO 100 to 12800 once, and stop guessing.",
      },
      {
        id: "exp-comp",
        title: "Exposure compensation, AEB and AE lock",
        where: "Quick control dial / exposure comp; shooting menu → Expo. comp./AEB.",
        options: [
          ["Exposure compensation", "Works in Fv and in M+Auto ISO too."],
          ["AEB", "Up to ±3 stops across 2, 3, 5 or 7 frames. Real estate, interiors, brackets for HDR."],
          ["AE lock (* button)", "Hold behavior and whether it holds after the shot are customizable."],
          ["Safety shift", "Lets the camera break your Tv or Av setting rather than blow the exposure."],
        ],
      },
      {
        id: "exp-tone",
        title: "Highlight tone priority and Auto Lighting Optimizer",
        where: "Shooting menu → Highlight tone priority / Auto Lighting Optimizer.",
        options: [
          ["Highlight tone priority D+", "Protects highlights, raises base ISO to 200. Weddings — white dresses."],
          ["D+2", "More protection, more noise in shadows."],
          ["Auto Lighting Optimizer", "Lifts shadows in JPEG/preview. Turn it off if you're shooting RAW and metering by histogram, since it makes the preview lie."],
        ],
      },
      {
        id: "exp-simulation",
        title: "Exposure simulation, histogram and the OVF-style view",
        where: "INFO button cycles displays; shooting menu → Exposure simulation; Shooting info display.",
        options: [
          ["Exposure simulation On", "Finder shows the actual exposure. Turn it off when shooting with studio strobes or the finder goes black."],

          ["OVF view assist", "Makes the finder behave like the 7D's optical finder. A comfort setting while you transition."],
        ],
      },
      {
        id: "exp-flicker",
        title: "Anti-flicker shooting",
        where: "Shooting menu → Anti-flicker shoot.",
        options: [
          ["On", "Times the shutter to the peak of a flickering light cycle. Gyms, arenas, LED-lit venues."],
        ],
        tip: "Works with the mechanical shutter. Indoor sports without it means banding and inconsistent color frame to frame.",
      },
    ],
  },
  {
    id: "drive",
    tab: "DRV",
    name: "Drive, shutter & burst",
    color: "#E39A3A",
    blurb: "Three shutter types with real tradeoffs — this is new territory coming from a DSLR.",
    items: [
      {
        id: "drv-shutter",
        title: "Shutter mode: mechanical, EFCS, electronic",
        where: "Shooting menu → Shutter mode.",
        options: [
          ["Mechanical", "Up to 12 fps. No rolling shutter, full flash sync, safest for flickering light. Loudest."],

        tip: "Silent is a superpower at ceremonies and in courtrooms — and a trap at a gym. Learn which is which by testing both.",

      {
        id: "drv-drive",
        title: "Drive modes and self-timer",
        where: "Drive button / M-Fn.",

          ["Single", "Deliberate work."],

        id: "drv-cards",

  {

const KEY = 'r5-checklist-progress';
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { done = {}; }

let active = SECTIONS[0].id;
let filter = 'all';
let open = null;

const TOTAL = SECTIONS.reduce((n,s)=>n+s.items.length,0);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e) {} };
const section = () => SECTIONS.find(s => s.id === active);
const doneCount = () => SECTIONS.reduce((n,s)=>n+s.items.filter(i=>done[i.id]).length,0);

function toggle(id){
  if (done[id]) delete done[id]; else done[id] = 1;
  save(); render();
}

function renderMeter(){
  const n = doneCount();
  const lit = Math.round((n/TOTAL)*40);
  $('meter').innerHTML = Array.from({length:40}, (_,i) =>
    `<i class="${i%5===0?'major':'minor'}${i<lit?' lit':''}"></i>`).join('');
  $('meterCount').textContent = n + ' / ' + TOTAL + ' learned';
  $('meterPct').textContent = Math.round((n/TOTAL)*100) + '%';
}

function renderTabs(){
  $('tabs').innerHTML = SECTIONS.map(s=>{
    const n = s.items.filter(i=>done[i.id]).length;
    const cls = s.id===active ? 'active' : (n===s.items.length ? 'complete' : '');
    return `<button class="dsp ${cls}" data-sec="${s.id}" ${s.id===active||n===s.items.length?`style="--accent:${s.color}"`:''}>${esc(s.tab)}<span class="mono">${n}/${s.items.length}</span></button>`;
  }).join('');
}

function renderList(){
  const s = section();
  const items = s.items.filter(i => filter==='all' ? true : filter==='todo' ? !done[i.id] : !!done[i.id]);
  if (!items.length){
    $('list').innerHTML = `<div class="empty">${filter==='todo'
      ? "Nothing left here. Pick another tab, or go shoot something with what you just learned."
      : "Nothing checked off in this section yet. Open an item and start with the first one."}</div>`;
    return;
  }
  $('list').innerHTML = items.map(item=>{
    const isDone = !!done[item.id], isOpen = open===item.id;
    const unit = s.optionsLabel ? 'steps' : 'settings';
    let detail = '';
    if (isOpen){
      detail = `<div class="detail">
        <div class="whereBox">
          <div class="lbl dsp accent">${esc(s.whereLabel || 'Where to change it')}</div>
          <div>${esc(item.where)}</div>
        </div>
        <div class="lbl dsp muted">${esc(s.optionsLabel || 'Options and when to use them')}</div>
        ${item.options.map(o=>`<div class="opt"><div class="n">${esc(o[0])}</div><div class="u">${esc(o[1])}</div></div>`).join('')}
        ${item.tip ? `<div class="tip">${esc(item.tip)}</div>` : ''}
        <button class="markBtn dsp" data-tick="${item.id}">${isDone?'Mark as not learned':'Mark as learned'}</button>
      </div>`;
    }
    return `<div class="card ${isDone?'done':''} ${isOpen?'open':''}" style="--accent:${s.color}">
      <div class="row">
        <button class="tickBtn" data-tick="${item.id}" aria-label="${isDone?'Mark as not learned':'Mark as learned'}">
          <span class="tick">${isDone?'&#10003;':''}</span>
        </button>
        <button class="titleBtn" data-open="${item.id}">
          <span class="t">${esc(item.title)}</span>
          <span class="sub mono">${item.options.length} ${unit} &middot; ${isOpen?'tap to close':'tap to open'}</span>
        </button>
      </div>
      ${detail}
    </div>`;
  }).join('');
}

function render(){
  const s = section();
  document.documentElement.style.setProperty('--accent', s.color);
  $('secName').textContent = s.name;
  $('secBlurb').textContent = s.blurb;
  $('secCount').textContent = s.items.filter(i=>done[i.id]).length + '/' + s.items.length;
  renderMeter(); renderTabs(); renderList();
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-tick]');
  if (t) return toggle(t.dataset.tick);
  const o = e.target.closest('[data-open]');
  if (o){ open = open===o.dataset.open ? null : o.dataset.open; return render(); }
  const sec = e.target.closest('[data-sec]');
  if (sec){ active = sec.dataset.sec; open = null; window.scrollTo({top:0}); return render(); }
  const f = e.target.closest('.filters button');
  if (f){
    filter = f.dataset.f;
    document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('on', b===f));
    return renderList();
  }
  if (e.target.id==='reset'){
    if (confirm('Clear every checkmark? This cannot be undone.')){ done={}; save(); render(); }
  }
});

render();

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
